set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
set -g status-style "bg=#F2CDAC,fg=#4E2E1F"
setw -g window-status-style "bg=#F2CDAC,fg=#4E2E1F"
setw -g window-status-current-style "bg=#E6C0A1,fg=#4E2E1F,bold"
set -g message-style "bg=#F2CDAC,fg=#4E2E1F"
setw -g mode-style "bg=#E6C0A1,fg=#45373c"

