#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = QT_QPA_PLATFORMTHEME,qt6ct
# default browser
env = BROWSER,firefox

################
### MONITORS ###
################
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = quickshell -p /home/$USER/rumda/common/quickshell/shell.qml &disown
exec-once = /home/$USER/.config/rumda/scripts/wall.sh light
exec-once = /home/$USER/.config/rumda/scripts/hyprtheme.sh light
exec-once = /home/$USER/.config/rumda/scripts/run_reminders.sh >/dev/null 2>&1

###################
### WINDOW RULE ###
###################

windowrule {
    name = firefox-pip
    match:class = ^(org\.mozilla\.firefox)$
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    size = 480 270
    move = (monitor_w-window_w-20) 20
    border_size = 0
    no_shadow = on
}

windowrule = float on, match:class feh
