background_opacity 1.0
remember_window_size no
initial_window_width 75c
initial_window_height 20c
window_padding_width 5 6
hide_window_decorations yes
confirm_os_window_close 0
box_drawing_scale 0.001, 0.6, 1, 1.5
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

font_family family="Terminess Nerd Font" style="Bold"
bold_font family="Terminess Nerd Font" style="Bold"
italic_font family="Greybeard 16px"
bold_italic_font family="Greybeard 16px"
font_size 12.0

cursor_shape underline
cursor_blink_interval 0.5
cursor_underline_thickness 1.0
cursor #6D4A39
cursor_text_color #F5DCC6

background #F5DCC6
foreground #4E2E1F
selection_foreground #45373c
selection_background #E6C0A1

color0 #20111b
color1 #be100e
color2 #858162
color3 #d08b30
color4 #426a79
color5 #97522c
color6 #989a9c
color7 #968c83

color8 #5e5252
color9 #be100e
color10 #858162
color11 #d08b30
color12 #426a79
color13 #97522c
color14 #989a9c
color15 #F5DCC6

shell /usr/bin/zsh
